---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./yaml-lint

  yaml-lint-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Simuliert ein Repository ohne eigene Config: Die .yamllint.yml im Root hätte
      # sonst Vorrang vor den geteilten Regeln und würde die Fixtures ignorieren.
      # Betrifft nur den Checkout dieses Jobs.
      - name: Remove the repository config
        run: rm .yamllint.yml

      - name: Shared rules allow on and long lines
        id: clean
        continue-on-error: true
        uses: ./yaml-lint
        with:
          directory: yaml-lint/tests/fixtures/clean

      - name: Warnings do not fail
        id: warning
        continue-on-error: true
        uses: ./yaml-lint
        with:
          directory: yaml-lint/tests/fixtures/warning

      - name: Errors fail, path with a space
        id: error
        continue-on-error: true
        uses: ./yaml-lint
        with:
          directory: yaml-lint/tests/fixtures/with space

      - name: The config input is honored
        id: config
        continue-on-error: true
        uses: ./yaml-lint
        with:
          directory: yaml-lint/tests/fixtures/with space
          config: yaml-lint/tests/relaxed-config.yml

      - name: A missing directory fails
        id: missing
        continue-on-error: true
        uses: ./yaml-lint
        with:
          directory: yaml-lint/tests/fixtures/missing

      - name: Input is not executed as shell
        id: injection
        continue-on-error: true
        uses: ./yaml-lint
        with:
          directory: 'missing; touch injected; true'

      - name: Add a repository config
        run: |
          printf -- '---\nextends: default\n' > .yamllint.yml

      - name: A repository config replaces the shared rules
        id: override
        continue-on-error: true
        uses: ./yaml-lint
        with:
          directory: yaml-lint/tests/fixtures/clean

      - name: Check the results
        env:
          CLEAN: ${{ steps.clean.outcome }}
          WARNING: ${{ steps.warning.outcome }}
          ERROR: ${{ steps.error.outcome }}
          CONFIG: ${{ steps.config.outcome }}
          MISSING: ${{ steps.missing.outcome }}
          INJECTION: ${{ steps.injection.outcome }}
          OVERRIDE: ${{ steps.override.outcome }}
        run: |
          set -x
          test "$CLEAN" = success
          test "$WARNING" = success
          test "$ERROR" = failure
          test "$CONFIG" = success
          test "$MISSING" = failure
          test "$INJECTION" = failure
          test "$OVERRIDE" = failure
          test ! -e injected

  end-of-file-fixer-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: python3 -m unittest discover -s end-of-file-fixer/tests

  end-of-file-fixer-behavior:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Real changed files are correct
        uses: ./end-of-file-fixer

      # Ein PR kann keine kaputten Dateien mitbringen, ohne dass der Schritt oben fehlschlägt.
      # Deshalb erzeugen wir sie hier und lassen einen Stub sie als geänderte Dateien melden.
      - name: Create bad files and a stub gh
        run: |
          printf 'no newline' > missing-newline.txt
          printf 'extra newlines\n\n\n' > 'extra newlines.txt'
          mkdir "$RUNNER_TEMP/stub"
          printf '#!/bin/sh\nprintf "missing-newline.txt\\nextra newlines.txt\\n"\n' > "$RUNNER_TEMP/stub/gh"
          chmod +x "$RUNNER_TEMP/stub/gh"
          echo "$RUNNER_TEMP/stub" >> "$GITHUB_PATH"

      - name: Check mode fails on bad files
        id: check
        continue-on-error: true
        uses: ./end-of-file-fixer

      - name: Check mode leaves files unchanged
        run: |
          test "$(cat missing-newline.txt)" = 'no newline'
          test "$(wc -l < 'extra newlines.txt')" -eq 3

      - name: The exclude input skips bad files
        uses: ./end-of-file-fixer
        with:
          exclude: '^(missing-newline|extra newlines)\.txt$'

      - name: Fix mode repairs bad files
        id: fix
        uses: ./end-of-file-fixer
        with:
          fix: true

      - name: Check mode passes on repaired files
        id: recheck
        uses: ./end-of-file-fixer

      - name: Check the results
        env:
          CHECK: ${{ steps.check.outcome }}
        run: |
          set -x
          test "$CHECK" = failure
          test "$(wc -l < missing-newline.txt)" -eq 1
          test "$(wc -l < 'extra newlines.txt')" -eq 1
