name: yaml-lint
description: This action performs a yaml lint check on the specified directory.
author: Marcus Ross
version: 1.0.0

inputs:
  directory:
    description: The directory to run the yaml lint check on.
    required: false
    default: '.'

outputs: {}

runs:
  using: "composite"
  steps:
    - name: Install yamllint
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install yamllint

    - name: Run yamllint
      id: lint
      shell: bash
      run: |
        # Wir nutzen das 'parsable' Format. 
        # Wir leiten stderr und stdout in eine Datei.
        # '|| true' verhindert, dass der Workflow hier sofort stoppt, 
        # damit wir die Datei im nächsten Schritt verarbeiten können.
        yamllint ${{ inputs.directory }} --format parsable > yamllint.txt 2>&1 || echo "lint_failed=true" >> $GITHUB_OUTPUT

    - name: Create GitHub Annotations
      if: steps.lint.outputs.lint_failed == 'true'
      shell: bash
      run: |
        # Wir lesen die yamllint.txt und wandeln sie in GitHub Workflow Commands um.
        # Format von yamllint parsable: file:line:col: message
        while read -r line; do
          # Extrahiere Datei, Zeile und Nachricht
          file=$(echo "$line" | cut -d: -f1)
          line_num=$(echo "$line" | cut -d: -f2)
          col=$(echo "$line" | cut -d: -f3)
          msg=$(echo "$line" | cut -d: -f4-)
          
          # GitHub Command für Warning/Error Annotationen
          echo "::error file=$file,line=$line_num,col=$col::$msg"
        done < yamllint.txt
        
        # Am Ende den Job explizit als fehlgeschlagen markieren
        exit 1
