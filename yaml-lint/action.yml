---
name: yaml-lint
description: Lint YAML files with yamllint and report findings as GitHub annotations.
author: Marcus Ross

inputs:
  directory:
    description: The file or directory to lint.
    required: false
    default: '.'
  config:
    description: Path to a yamllint config file. If empty, a repository config or the shared default is used.
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Run yamllint
      shell: bash
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        # Greift nur, wenn das Repository keine eigene .yamllint-Datei hat.
        export YAMLLINT_CONFIG_FILE="$GITHUB_ACTION_PATH/default-config.yml"

        args=(--format github)
        if [ -n "$INPUT_CONFIG" ]; then
          args+=(--config-file "$INPUT_CONFIG")
        fi

        pipx run --spec "yamllint==1.38.0" yamllint "${args[@]}" -- "$INPUT_DIRECTORY"
